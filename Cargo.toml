[workspace]
resolver = "3"
members = ["crates/quebracho-x402", "crates/quebracho-x402-screening", "crates/quebracho-x402-qnx"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/quebracho-digital/x402-rs"
homepage = "https://github.com/quebracho-digital/x402-rs"

[workspace.dependencies]
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
sha3 = { version = "0.10", default-features = false }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"
