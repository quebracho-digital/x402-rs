name: mutants

# Mutation testing is slow (about 25 minutes): weekly and by hand, not on every push.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutants:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        crate: [quebracho-x402, quebracho-x402-screening, quebracho-x402-qnx]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-mutants
      - run: cargo mutants -p ${{ matrix.crate }} --test-workspace=true --all-features --timeout 300
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: mutants-${{ matrix.crate }}
          path: mutants.out
