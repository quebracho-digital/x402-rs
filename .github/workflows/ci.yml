name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all --all-features
      # The core and the screening crate must stay no_std.
      - run: cargo build -p quebracho-x402 -p quebracho-x402-screening --target wasm32-unknown-unknown

  conformance:
    # The vectors must be exactly what the pinned PHP library exports.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: conformance/export.sh
      - run: git diff --exit-code conformance/vectors

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --no-banner --baseline-path /repo/.gitleaks-baseline.json
