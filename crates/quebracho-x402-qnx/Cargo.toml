[package]
name = "quebracho-x402-qnx"
description = "Platform adapters for quebracho-x402 on QNX 8.0 (and any POSIX host): file ledger, stop switch, clock, OFAC list files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Published once it builds and runs on QNX 8.0 (the viability test).
publish = false

[dependencies]
quebracho-x402 = { path = "../quebracho-x402", version = "0.1.1" }
quebracho-x402-screening = { path = "../quebracho-x402-screening", version = "0.1.1" }
serde_json = { version = "1", features = ["std"] }
sha2 = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "=0.1.0-pre.0"
webpki-roots = "1"

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "=0.1.0-pre.0"

[lints]
workspace = true
